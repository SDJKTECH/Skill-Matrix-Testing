<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>

    <radialGradient id="bgGrad" cx="38%" cy="38%" r="72%">
      <stop offset="0%"   stop-color="#1a5cbf"/>
      <stop offset="100%" stop-color="#05174a"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="barL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#74c6ff"/>
      <stop offset="100%" stop-color="#1a5cbf"/>
    </linearGradient>

    <linearGradient id="barR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#007fa3"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">

    <!-- ── Background ── -->
    <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

    <!-- ── Scattered particles ── -->
    <circle cx="18"  cy="32"  r="4.5" fill="#2a6cc4" opacity="0.45"/>
    <circle cx="35"  cy="14"  r="6"   fill="#2a6cc4" opacity="0.35"/>
    <circle cx="52"  cy="24"  r="3"   fill="#3a7cd4" opacity="0.50"/>
    <circle cx="70"  cy="10"  r="5"   fill="#2a6cc4" opacity="0.30"/>
    <circle cx="90"  cy="18"  r="7"   fill="#3a7cd4" opacity="0.38"/>
    <circle cx="112" cy="7"   r="3.5" fill="#2a6cc4" opacity="0.45"/>
    <circle cx="132" cy="20"  r="5.5" fill="#3a7cd4" opacity="0.32"/>
    <circle cx="152" cy="13"  r="3"   fill="#2a6cc4" opacity="0.48"/>
    <circle cx="172" cy="27"  r="6"   fill="#3a7cd4" opacity="0.38"/>
    <circle cx="187" cy="45"  r="3.5" fill="#2a6cc4" opacity="0.42"/>
    <circle cx="8"   cy="62"  r="5"   fill="#2a6cc4" opacity="0.38"/>
    <circle cx="22"  cy="85"  r="3"   fill="#3a7cd4" opacity="0.48"/>
    <circle cx="12"  cy="115" r="6"   fill="#2a6cc4" opacity="0.28"/>
    <circle cx="20"  cy="145" r="3.5" fill="#3a7cd4" opacity="0.42"/>
    <circle cx="8"   cy="168" r="5"   fill="#2a6cc4" opacity="0.45"/>
    <circle cx="28"  cy="183" r="3.5" fill="#3a7cd4" opacity="0.38"/>
    <circle cx="52"  cy="192" r="6"   fill="#2a6cc4" opacity="0.32"/>
    <circle cx="80"  cy="188" r="3.5" fill="#3a7cd4" opacity="0.46"/>
    <circle cx="108" cy="194" r="5"   fill="#2a6cc4" opacity="0.38"/>
    <circle cx="135" cy="190" r="3.5" fill="#3a7cd4" opacity="0.42"/>
    <circle cx="158" cy="185" r="6"   fill="#2a6cc4" opacity="0.32"/>
    <circle cx="178" cy="172" r="3.5" fill="#3a7cd4" opacity="0.46"/>
    <circle cx="191" cy="152" r="5"   fill="#2a6cc4" opacity="0.38"/>
    <circle cx="195" cy="125" r="3"   fill="#3a7cd4" opacity="0.46"/>
    <circle cx="193" cy="98"  r="6"   fill="#2a6cc4" opacity="0.28"/>
    <circle cx="188" cy="72"  r="3.5" fill="#3a7cd4" opacity="0.42"/>
    <circle cx="42"  cy="48"  r="2.5" fill="#5a8cd4" opacity="0.28"/>
    <circle cx="162" cy="54"  r="3"   fill="#5a8cd4" opacity="0.30"/>
    <circle cx="58"  cy="163" r="3.5" fill="#5a8cd4" opacity="0.28"/>
    <circle cx="142" cy="168" r="2.5" fill="#5a8cd4" opacity="0.32"/>

    <!-- ── Left bar chart ── -->
    <rect x="26" y="103" width="9" height="24" fill="url(#barL)" rx="1.5" opacity="0.88"/>
    <rect x="38" y="89"  width="9" height="38" fill="url(#barL)" rx="1.5" opacity="0.88"/>
    <rect x="50" y="75"  width="9" height="52" fill="url(#barL)" rx="1.5" opacity="0.88"/>

    <!-- ── Right bar chart ── -->
    <rect x="142" y="95"  width="7" height="32" fill="url(#barR)" rx="1.5" opacity="0.80"/>
    <rect x="152" y="84"  width="7" height="43" fill="url(#barR)" rx="1.5" opacity="0.80"/>
    <rect x="162" y="70"  width="7" height="57" fill="url(#barR)" rx="1.5" opacity="0.80"/>
    <rect x="172" y="85"  width="7" height="42" fill="url(#barR)" rx="1.5" opacity="0.80"/>

    <!-- Small accent squares (right side) -->
    <rect x="176" y="110" width="11" height="11" fill="#00c8e0" rx="2" opacity="0.68"/>
    <rect x="162" y="132" width="11" height="11" fill="#00dff2" rx="2" opacity="0.56"/>

    <!-- ── Main grid  3 rows × 4 cols ── -->
    <!-- cell size 19 × 19, gap 2, grid origin (60, 50) -->
    <!-- Row 1 -->
    <rect x="60"  y="50" width="19" height="19" fill="#4a9de0" rx="1.5"/>
    <rect x="82"  y="50" width="19" height="19" fill="#5bb5f8" rx="1.5"/>
    <rect x="104" y="50" width="19" height="19" fill="#f5b800" rx="1.5"/>
    <rect x="126" y="50" width="19" height="19" fill="#44cc44" rx="1.5"/>

    <!-- Row 2 -->
    <rect x="60"  y="72" width="19" height="19" fill="#f5b800" rx="1.5"/>
    <rect x="82"  y="72" width="19" height="19" fill="#4a9de0" rx="1.5"/>
    <rect x="104" y="72" width="19" height="19" fill="#44cc44" rx="1.5"/>
    <rect x="126" y="72" width="19" height="19" fill="#f5b800" rx="1.5"/>

    <!-- Row 3 -->
    <rect x="60"  y="94" width="19" height="19" fill="#44cc44" rx="1.5"/>
    <rect x="82"  y="94" width="19" height="19" fill="#f5b800" rx="1.5"/>
    <rect x="104" y="94" width="19" height="19" fill="#f5b800" rx="1.5"/>
    <rect x="126" y="94" width="19" height="19" fill="#4a9de0" rx="1.5"/>

    <!-- ── Growth trend line ── -->
    <polyline points="20,128 52,112 80,90 108,66 145,42"
              fill="none"
              stroke="url(#lineGrad)"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    <!-- Glow burst at hot node -->
    <circle cx="108" cy="66" r="9" fill="#ffb300" opacity="0.30" filter="url(#softGlow)"/>

    <!-- Line nodes -->
    <circle cx="20"  cy="128" r="4"   fill="#ffffff" filter="url(#glow)"/>
    <circle cx="52"  cy="112" r="4"   fill="#ffffff" filter="url(#glow)"/>
    <circle cx="80"  cy="90"  r="4"   fill="#ffffff" filter="url(#glow)"/>
    <circle cx="108" cy="66"  r="4"   fill="#ffffff" filter="url(#glow)"/>
    <circle cx="145" cy="42"  r="4.5" fill="#00e5ff" filter="url(#glow)"/>

    <!-- ── Label ── -->
    <text x="100" y="152"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#ffffff"
          text-anchor="middle"
          letter-spacing="1.5">Skill Matrix</text>

  </g>
</svg>
